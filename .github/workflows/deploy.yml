name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Install devenv
        run: nix profile install --accept-flake-config tarball+https://install.devenv.sh/latest

      # The same gate ci.yml and the pre-commit hook run: elm-format --validate,
      # elm make src/Main.elm, elm-test, the JSON Schema tests, elm-review. It
      # runs `make gen` first, which generates .elm-tailwind/ — Elm tooling
      # cannot compile without it.
      #
      # This used to be three steps invoking elm-test and elm-review directly,
      # which skipped formatting, never compiled src/Main.elm, and never ran the
      # schema tests. Don't unroll it again: if this and `make check` diverge,
      # main is being held to a weaker standard than a pull request.
      - name: Check
        run: devenv shell -- make check

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # The base path is set via `base` in vite.config.js, so no <base href> patching.
      - name: Build application
        env:
          VITE_GITLAB_CLIENT_ID: ${{ secrets.VITE_GITLAB_CLIENT_ID }}
        run: devenv shell make dist-ci

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
