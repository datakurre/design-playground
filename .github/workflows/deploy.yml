name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Install devenv
        run: nix profile install --accept-flake-config tarball+https://install.devenv.sh/latest

      # Generates .elm-tailwind/, which elm.json lists as a source directory.
      # Must run before elm-test and elm-review can compile the project.
      - name: Generate Tailwind Elm API
        run: devenv shell make gen

      - name: Run Tests (elm-test)
        run: devenv shell elm-test

      - name: Run Linter (elm-review)
        run: devenv shell elm-review

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # The base path is set via `base` in vite.config.js, so no <base href> patching.
      - name: Build application
        run: devenv shell make dist-ci

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
