name: Deploy GitHub Pages

# Builds the published site — Storybook (design system docs, component
# workbench, and the live validated screens) — and deploys it to GitHub
# Pages. Runs on the default branch and on demand. One-time setup:
# repository Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Regenerate every artifact deterministically (the Screens stories
      # import the generated scenario ASTs and the Governance doc embeds the
      # generated reports), then build Storybook as the published site.
      - run: pnpm pipeline
      - run: pnpm site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
