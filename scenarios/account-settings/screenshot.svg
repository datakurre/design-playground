ns-serif" font-size="15" font-weight="400" fill="#0f172a">Deleting your account is permanent and removes all of your data.</text><rect x="52" y="409" width="166" height="40" rx="8" fill="#dc2626"/><text x="135" y="434" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Delete account</text><rect x="32" y="497" width="696" height="153" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="32" y="497" width="696" height="4" rx="0" fill="#dc2626"/><text x="52" y="535" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Delete your account?</text><text x="52" y="566" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="400" fill="#0f172a">This permanently deletes your account and all associated data. This cannot be undone.</text><rect x="540" y="602" width="168" height="38" rx="8" fill="#dc2626"/><text x="624" y="626" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Delete my account</text><rect x="376" y="602" width="152" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="452" y="626" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Keep my account</text><line x1="0" y1="678" x2="760" y2="678" stroke="#cbd5e1" stroke-dasharray="4 4"/>
